{% extends "mailcraft/emails/base.html" %}
{% block main_text %}
  {% trans pkg_title=pkg_title or pkg_name %}
    <p>Hi</p>

    <p>
      {{ name }} has a query about <a href="{{ pkg_url }}">{{ pkg_title }}</a>:<br/>
      <span style="white-space: pre-line;">{{ message }}</span>
    </p>

    <p>
      Please respond to <a href="mailto:{{ email }}">{{ email }}</a>
    </p>
  {% endtrans %}
{% endblock %}
